        <h1>把 DeepSeek Harness 装进原生桌面 — DSH Desktop Ultra</h1>
        <p>DeepSeek Harness 的 Tauri 2 桌面外壳。不 fork、不改一行上游代码、不加任何功能：原生窗口、托盘常驻、进程监护、自动更新，只做打包，绝不越界。支持 Windows、macOS、Linux，代码开源（MIT）。</p>
        <p>
          <a class="btn" href="https://github.com/ijry/DeepSeek-Harness-Desktop-Ultra/releases/latest">立即下载（Windows / macOS / Linux）</a>
          <a class="btn" href="https://github.com/ijry/DeepSeek-Harness-Desktop-Ultra">查看 GitHub 源码</a>
        </p>
        <h2>外壳只做 dsh 做不到的事</h2>
        <ul>
          <li>原生桌面窗口：基于 Tauri 2 的系统原生窗口与图标，支持缩放、任务栏与多任务切换。</li>
          <li>托盘常驻，关窗不退出：点关闭只是收进系统托盘，dsh 继续后台运行，再次打开秒回现场。</li>
          <li>智能 Node 探测与校验：启动时定位并校验本机 Node，缺失或过旧时给出带下载链接的指引页。</li>
          <li>锁定精确的 dsh 版本：私有目录安装并锁定 @deepseek-ai/dsh 精确版本，坏版本可自动回滚。</li>
          <li>进程监护与收尾：轮询直到 dsh 就绪，退出时清理整棵进程树，不留孤儿进程。</li>
          <li>外壳自身自动更新：内置 Tauri 更新器与签名清单，发版后下次启动即收到更新。</li>
        </ul>
        <h2>一条不可协商的硬约束</h2>
        <ul>
          <li>不 fork、不改上游</li>
          <li>不代理、不拦截、不转换</li>
          <li>不做自己的 UI</li>
          <li>不「顺手修」上游 bug</li>
          <li>不加任何功能</li>
        </ul>
        <h2>常见问题</h2>
        <q>为什么第一次启动那么慢？</q>
        <p>dsh 采用插件化架构，首次启动需要安装 450+ 个包（约 200MB）。外壳会显示进度与耗时，超过 20 分钟会中止并给出诊断；装完后每次启动只需约 2 秒。</p>
        <q>一定要自己装 Node 吗？</q>
        <p>是的。外壳不捆绑运行时，要求 Node ^22.19 或 >=24；不满足时启动页会给出下载链接，也可以用环境变量 DSH_DESKTOP_NODE 显式指定路径。</p>
        <q>点关闭按钮是退出吗？</q>
        <p>不是。关闭只是把窗口收进系统托盘，dsh 继续在后台运行，下次打开秒回。唯一真正的退出入口：右键托盘图标 → 退出。</p>
        <q>这是 DeepSeek 官方的应用吗？</q>
        <p>不是。这是独立的第三方开源打包项目，与 DeepSeek 无隶属关系。上游 DeepSeek Harness 由 DeepSeek AI 开源（MIT）。</p>
