<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="DSH Desktop Ultra">
  <!-- 与 src-tauri/icons/ 里的应用图标同一套几何,由 scripts/make-icon.py 生成 PNG 版本。
       改动这里请同步改那个脚本,否则窗口图标和页面图标会不一致。 -->
  <defs>
    <linearGradient id="dsh-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <mask id="dsh-glyph">
      <rect width="128" height="128" fill="black"/>
      <!-- 字母 D:左侧竖直,右侧为直径等于字高的正半圆 -->
      <path d="M37.5 30.1 H56.5 a33.9 33.9 0 0 1 0 67.8 H37.5 Z" fill="white"/>
      <!-- 内孔取正圆:在 16px 下形状已不可辨,正圆比 D 形内孔更干净 -->
      <circle cx="56.5" cy="64" r="18" fill="black"/>
    </mask>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#dsh-tile)"/>
  <rect width="128" height="128" rx="28" fill="white" mask="url(#dsh-glyph)"/>
</svg>
