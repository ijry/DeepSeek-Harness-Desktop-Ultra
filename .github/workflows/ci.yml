name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 前端类型检查与测试
        run: |
          npm run typecheck
          npm test

      # 墨鱼终端与鲨鱼数据库是唯二有运行时依赖的插件，而上面的 `npm ci` 只装了外壳自己的
      # 依赖。墨鱼终端的测试要起一个真的 ssh2.Server，所以依赖必须在下面那个 for 循环之前
      # 就位，否则循环里的 `node --test` 会直接 import 失败。
      - name: 墨鱼终端插件依赖
        working-directory: plugins/dsh-plugin-otools-term
        run: npm ci --no-audit --no-fund

      # 鲨鱼数据库同理：驱动（mysql2/pg/ioredis/…）与写文件用的 exceljs、docx 都是运行时
      # 依赖，测试真的会调用它们。`--omit=optional` 跳过 oracledb 与 snowflake-sdk —— 它们
      # 按设计就是可选的，装不上时插件会报「驱动未安装」，CI 没必要为它们等编译。代价是
      # 连 rollup 的平台原生包一起跳过，所以这一步之后不能跑 vite build——check.mjs 与
      # pack-plugins.mjs 都跳过面板构建（DBM_SKIP_WEBVIEW），lib/webview 随提交入库。
      - name: 鲨鱼数据库插件依赖
        working-directory: plugins/dsh-plugin-otools-dbm
        run: npm ci --omit=optional --no-audit --no-fund

      # 九个插件全部进安装包，所以每一个都必须能构建、测试通过、且 lib/ 与 src/ 同步。
      # check.mjs 会重建 lib/，紧接着的 diff 就是「产物忘记提交」的守卫；
      # 行尾在 Windows 上会被 autocrlf 干扰，只在 Linux 上判。
      - name: 内置插件检查
        run: |
          for plugin in plugins/dsh-plugin-*; do
            echo "::group::$plugin"
            (cd "$plugin" && node scripts/check.mjs && node --test)
            echo "::endgroup::"
          done
        shell: bash

      - name: 插件构建产物必须已提交
        if: runner.os == 'Linux'
        run: git diff --exit-code -- 'plugins/dsh-plugin-*/lib'

      - name: 前端构建
        run: npm run build

      - name: Rust 格式与静态检查
        run: |
          npm run rust:fmt:check
          npm run rust:check

      - name: Rust 测试
        run: npm run rust:test
