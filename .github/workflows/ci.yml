name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 前端类型检查与测试
        run: |
          npm run typecheck
          npm test

      # 安装包会分发内置插件的 lib/，所以它必须能构建、测试通过、且与 src/ 同步。
      # check.mjs 会重建 lib/，紧接着的 diff 就是「产物忘记提交」的守卫；
      # 行尾在 Windows 上会被 autocrlf 干扰，只在 Linux 上判。
      - name: 内置插件检查
        run: |
          for plugin in plugins/dsh-plugin-*; do
            echo "::group::$plugin"
            (cd "$plugin" && node scripts/check.mjs && node --test)
            echo "::endgroup::"
          done
        shell: bash

      - name: 插件构建产物必须已提交
        if: runner.os == 'Linux'
        run: git diff --exit-code -- 'plugins/dsh-plugin-*/lib'

      # 画布插件同样进安装包，所以同一对守卫照用一遍。
      - name: 画布插件检查
        working-directory: plugins/dsh-plugin-canvas
        run: |
          node scripts/check.mjs
          node --test

      - name: 画布插件产物必须已提交
        if: runner.os == 'Linux'
        run: git diff --exit-code -- plugins/dsh-plugin-canvas/lib

      # 仓库面板与章鱼Git 都不进安装包（只走 `dsh plugin add` 安装），但它们的 lib/
      # 同样是发布产物 —— package.json 的 files 带着它，所以同一条守卫照用。
      - name: 仓库面板插件检查
        working-directory: plugins/dsh-plugin-repopanel
        run: |
          node scripts/check.mjs
          node --test

      - name: 仓库面板插件产物必须已提交
        if: runner.os == 'Linux'
        run: git diff --exit-code -- plugins/dsh-plugin-repopanel/lib

      - name: 章鱼Git 插件检查
        working-directory: plugins/dsh-plugin-otools-git
        run: |
          node scripts/check.mjs
          node --test

      - name: 章鱼Git 插件产物必须已提交
        if: runner.os == 'Linux'
        run: git diff --exit-code -- plugins/dsh-plugin-otools-git/lib

      - name: 前端构建
        run: npm run build

      - name: Rust 格式与静态检查
        run: |
          npm run rust:fmt:check
          npm run rust:check

      - name: Rust 测试
        run: npm run rust:test
