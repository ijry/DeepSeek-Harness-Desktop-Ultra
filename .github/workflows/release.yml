name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备 Release
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 tag 与版本号一致
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)(\.[0-9]+)?)?$ ]]; then
            echo "tag 格式不支持: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"

          for pair in "package.json:$package_version" "tauri.conf.json:$tauri_version" "Cargo.toml:$cargo_version"; do
            name="${pair%%:*}"; value="${pair##*:}"
            if [[ "$value" != "$tag_version" ]]; then
              echo "$name 的版本 $value 与 tag $GITHUB_REF_NAME 不一致" >&2
              exit 1
            fi
          done

      - name: 拒绝发布占位公钥
        shell: bash
        run: |
          pubkey="$(node -p "require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey ?? ''")"
          if [[ -z "$pubkey" || "$pubkey" == REPLACE_WITH* ]]; then
            echo "tauri.conf.json 里的 updater.pubkey 还是占位值；先跑 npm run generate-keys。" >&2
            exit 1
          fi

      - name: tag 必须在默认分支上
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "tag ${GITHUB_REF_NAME} 不在 ${DEFAULT_BRANCH} 上" >&2
            exit 1
          fi

      - name: 从 tag commit 取发布说明
        id: notes
        shell: bash
        run: |
          git log -1 --format=%B "$GITHUB_SHA" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "tag commit 的 message 为空，发布说明会是空的。" >&2
            exit 1
          fi
          delimiter="notes-$(openssl rand -hex 8)"
          {
            echo "body<<${delimiter}"
            cat release-notes.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: 创建草稿 Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          allowUpdates: true
          bodyFile: release-notes.md

  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            platform: windows-x86_64
            bundles: nsis
          - label: macOS (Apple Silicon)
            os: macos-latest
            platform: darwin-aarch64
            bundles: app dmg
          - label: Linux
            os: ubuntu-22.04
            platform: linux-x86_64
            bundles: deb appimage
    env:
      CI: true
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验签名密钥已配置
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "缺少 secret TAURI_SIGNING_PRIVATE_KEY，无法生成带签名的更新包。" >&2
            exit 1
          fi

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 前端检查
        run: |
          npm run typecheck
          npm test

      # 必须在 Rust 检查之前。tauri::generate_context! 是编译期宏,会校验
      # tauri.conf.json 里 frontendDist 指向的 ../dist 真实存在——没有它
      # cargo check 会直接 proc macro panic。顺序错了三个平台会一起挂。
      - name: 构建前端产物
        run: npm run build

      - name: Rust 检查
        run: |
          npm run rust:fmt:check
          npm run rust:check
          npm run rust:test

      - name: 构建 Tauri 安装包
        run: npm run tauri:build -- --ci --bundles ${{ matrix.bundles }}

      - name: 归集产物
        shell: bash
        run: |
          dest="release-assets/${{ matrix.platform }}"
          mkdir -p "$dest"

          # 只收安装包和更新包。排除 control.tar.gz / data.tar.gz——那是
          # dpkg 打 .deb 时的内部文件,不是发布产物,v0.1.0 误发过。
          find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.sig' \) \
            ! -name 'control.tar.gz' ! -name 'data.tar.gz' \
            -print0 |
          while IFS= read -r -d '' src; do
            # 文件名里的空格必须在上传前去掉:GitHub 会把资源名里的空格
            # 换成点,而更新清单里的 URL 是按本地文件名拼的——不统一就 404。
            # v0.1.0 的 macOS 条目就是这么坏掉的。
            base="$(basename "$src")"
            cp "$src" "$dest/${base// /.}"
          done

          if [[ -z "$(ls -A "$dest")" ]]; then
            echo "没有找到任何构建产物。" >&2
            exit 1
          fi
          if ! ls "$dest"/*.sig >/dev/null 2>&1; then
            echo "没有找到 .sig 签名文件；更新器会拒绝这些产物。" >&2
            exit 1
          fi
          if ls "$dest" | grep -q ' '; then
            echo "仍有文件名含空格，上传后会被 GitHub 改名。" >&2
            exit 1
          fi
          ls -la "$dest"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-assets/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 还原发布说明
        env:
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
        shell: bash
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "prepare 阶段没有产出发布说明。" >&2
            exit 1
          fi

      - name: 生成更新清单
        run: |
          node scripts/create-updater-manifest.mjs \
            --assets-dir release-assets \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --output release-assets/latest.json \
            --notes-file release-notes.md
          cat release-assets/latest.json

      - name: 发布
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          allowUpdates: true
          bodyFile: release-notes.md
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "release-assets/**/*.*"
