# dsh-plugin-automation bundle patch: inserts the plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
#   dsh plugin --profile <name> add link:<path-to-this-package>
# or install the published npm package with
#   dsh plugin --profile <name> add dsh-plugin-automation
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (the ledger, the scheduler loop, the headless run spawner and
# the routes), and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: dsh-plugin-automation
      name: dsh-plugin-automation
