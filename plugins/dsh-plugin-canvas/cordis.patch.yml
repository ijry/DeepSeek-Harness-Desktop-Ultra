# dsh-plugin-canvas bundle patch: inserts the plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) over dsh-base; activate with
#   dsh plugin --profile <name> add link:<path-to-this-package>
# or install the published npm package with
#   dsh plugin --profile <name> add dsh-plugin-canvas
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (the board ledger and its JSON+SSE routes), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: dsh-plugin-canvas
      name: dsh-plugin-canvas
