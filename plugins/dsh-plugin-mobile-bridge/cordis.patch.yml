# dsh-plugin-mobile-bridge bundle patch: inserts the plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
#   dsh plugin --profile <name> add link:<path-to-this-package>
# or install the published npm package with
#   dsh plugin --profile <name> add dsh-plugin-mobile-bridge
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (bridge routes, pairing store, LAN listener), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
#
# Config lives under this row when a deployment wants non-default behavior, e.g.
#   - insert:
#       - id: dsh-plugin-mobile-bridge
#         name: dsh-plugin-mobile-bridge
#         config:
#           lanPort: 8790
#           lan: true
- insert:
    - id: dsh-plugin-mobile-bridge
      name: dsh-plugin-mobile-bridge
